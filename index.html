<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Blueprint</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui}.wrap{max-width:900px;margin:auto;padding:40px}h1{font-size:52px}#drop{border:2px dashed #4f6cff;padding:50px;border-radius:18px;text-align:center;margin:30px 0}button{background:#4f6cff;color:#fff;border:0;padding:14px 22px;border-radius:12px}img{max-width:100%;display:none;border-radius:12px;margin-top:20px}textarea{width:100%;height:180px;background:#141b31;color:#fff;border-radius:12px;margin-top:20px}</style></head><body><div class='wrap'><h1>Blueprint</h1><p>Upload an AI image and recreate its prompt.</p><div id='drop'><input id='file' type='file' accept='image/*'><img id='preview'></div><button onclick='analyze()'>Analyze Image</button><textarea id='out' readonly placeholder='Prompt will appear here...'></textarea></div><script>file.onchange=e=>{let f=e.target.files[0];if(f){preview.src=URL.createObjectURL(f);preview.style.display='block';}};function analyze(){out.value='Vision API integration coming in next commit.'}</script></body></html>
